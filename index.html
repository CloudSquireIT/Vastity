<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Vastity: esplora il cielo in tempo reale e pilota una navicella nello spazio, fino alla velocità della luce e oltre." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon-64.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <title>Vastity</title>
  <style>
    /* stile minimo del caricamento, inline: visibile prima che arrivino CSS e font */
    html, body { margin: 0; background: #03050c; }
    body.loading .ui, body.loading .overlay { visibility: hidden; }
    #loader { position: fixed; inset: 0; z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(ellipse at 50% 60%, #0b1430 0%, #03050c 70%); color: #eef2ff; }
    #loader .loader-n { font: 300 min(calc((100vw - 2 * max(28px, env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px))) / 7.3), 15vh)/1 -apple-system, "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif; letter-spacing: .42em; text-indent: .42em;
      text-transform: uppercase; color: rgba(240, 244, 255, .88); text-shadow: 0 1px 8px rgba(0, 0, 0, .6); white-space: nowrap; position: relative; z-index: 1; }
    /* le lettere sono l'indicatore: si accendono una dopo l'altra, dalla V alla Y */
    #loader .loader-n span { display: inline-block; opacity: .12; }
    /* campo di stelle che si avvicina lentamente: dà profondità all'attesa */
    #loader::before { content: ''; position: absolute; inset: -20%; pointer-events: none;
      background-image: radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 67% 32%, #dfe8ff 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 38% 74%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 84% 66%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 22% 52%, #cfdcff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 56% 9%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 91% 12%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 5% 88%, #e8eeff 50%, transparent 51%);
      background-size: 230px 230px; opacity: .55; animation: ld-drift 4.6s cubic-bezier(.3, .1, .3, 1) both; }
    #loader::after { content: ''; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 60% 40% at 50% 52%, rgba(90, 120, 255, .22), transparent 70%); opacity: var(--p, 0); }
    @keyframes ld-drift { from { transform: scale(1); opacity: 0; } 15% { opacity: .55; } to { transform: scale(1.35); opacity: .7; } }
    @media (prefers-reduced-motion: reduce) { #loader::before { animation: none; } }
  </style>
</head>
<body class="loading">
  <div id="app"></div>
  <div id="loader"><div class="loader-n" aria-label="Vastity"><span style="--i:0">V</span><span style="--i:1">A</span><span style="--i:2">S</span><span style="--i:3">T</span><span style="--i:4">I</span><span style="--i:5">T</span><span style="--i:6">Y</span></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
