<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Vastity: esplora il cielo in tempo reale e pilota una navicella nello spazio, fino alla velocità della luce e oltre." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon-64.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <title>Vastity</title>
  <style>
    /* stile minimo del caricamento, inline: visibile prima che arrivino CSS e font */
    html, body { margin: 0; background: #03050c; }
    #loader { position: fixed; inset: 0; z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(ellipse at 50% 60%, #0b1430 0%, #03050c 70%); color: #eef2ff; }
    #loader .loader-n { font: 400 15px/1 -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; letter-spacing: .42em; text-indent: .42em;
      text-transform: uppercase; color: rgba(240, 244, 255, .88); text-shadow: 0 1px 8px rgba(0, 0, 0, .6); white-space: nowrap; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loader"><svg class="mini-bh" viewBox="0 0 40 40" aria-hidden="true"><circle class="t" cx="20" cy="20" r="17"/><circle class="p" cx="20" cy="20" r="17" pathLength="100"/></svg><div class="loader-n" aria-label="Vastity"><span style="--i:0">V</span><span style="--i:1">A</span><span style="--i:2">S</span><span style="--i:3">T</span><span style="--i:4">I</span><span style="--i:5">T</span><span style="--i:6">Y</span></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
