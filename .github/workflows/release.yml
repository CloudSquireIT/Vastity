# Release di Vastity: si avvia pubblicando un tag "v*" (es. v1.0.0) o a mano da Actions.
# - web: build e pubblicazione su GitHub Pages (Settings → Pages → Source: GitHub Actions)
# - android: APK installabile e AAB per il Play Store, firmati se sono presenti i secret ANDROID_*
# - ios: verifica che il progetto Xcode compili (la firma e l'invio a TestFlight richiedono
#   i certificati Apple: vedi RELEASE.md)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  # nome dei file: il tag (v1.0.0) o, se avviata a mano, la versione di package.json
  VER: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: echo "VER=${VER:-v$(node -p "require('./package.json').version")}" >> $GITHUB_ENV
      - run: npm run build
      - run: cd dist && zip -qr ../vastity-web-$VER.zip .
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - uses: actions/upload-artifact@v4
        with: { name: web, path: vastity-web-*.zip }

  pages:
    needs: web
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: echo "VER=${VER:-v$(node -p "require('./package.json').version")}" >> $GITHUB_ENV
      - run: npm run build && npx cap sync android
      - name: Firma (se configurata)
        if: env.HAS_KEYSTORE == 'true'
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: |
          echo "$KS" | base64 -d > android/app/release.keystore
          cat >> android/gradle.properties <<PROPS
          VASTITY_STORE_FILE=release.keystore
          VASTITY_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VASTITY_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          VASTITY_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease bundleRelease assembleDebug --no-daemon
      - run: |
          mkdir out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/vastity-$VER-debug.apk
          cp android/app/build/outputs/apk/release/*.apk out/vastity-$VER-release.apk
          cp android/app/build/outputs/bundle/release/*.aab out/vastity-$VER.aab
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/* }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build && npx cap sync ios
      - name: Compila per il simulatore (verifica, senza firma)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20

  release:
    needs: [web, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          name: Vastity ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/web/*
            artifacts/android/*
